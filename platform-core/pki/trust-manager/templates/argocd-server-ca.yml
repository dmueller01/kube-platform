---
# (BackendTLSPolicy benötigt Key "ca.crt", nicht "ca-bundle.crt")
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: argocd-server-ca
  namespace: cert-manager
spec:
  sources:
    - secret:
        name: cluster-ca
        key: ca.crt
  target:
    configMap:
      key: ca.crt
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: argocd
