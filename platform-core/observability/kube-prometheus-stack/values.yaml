---
fullnameOverride: prometheus
nameOverride: prometheus
cleanPrometheusOperatorObjectNames: true
defaultRules:
  create: true

alertmanager:
  enabled: false
  alertmanagerSpec:
    replicas: 1
    retention: 120h
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

grafana:
  enabled: false

kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

prometheus:
  fullnameOverride: prometheus
  nameOverride: prometheus
  serviceAccount:
    create: true
    name: prometheus
  prometheusSpec:
    replicas: 1
    retention: 24h
    walCompression: true
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 8Gi

prometheusOperator:
  fullnameOverride: prometheus-operator
  revisionHistoryLimit: 1
  tls:
    enabled: true
    tlsMinVersion: VersionTLS13
  admissionWebhooks:
    enabled: true
    patch:
      enabled: true
    certManager:
      enabled: true
      issuerRef:
        name: ca-cluster-issuer
        kind: ClusterIssuer

prometheus-node-exporter:
  fullnameOverride: node-exporter
  prometheus:
    monitor:
      enabled: true

kube-state-metrics:
  fullnameOverride: kube-state-metrics
  prometheus:
    monitor:
      enabled: true
  resources:
    limits:
     memory: 64Mi
    requests:
     cpu: 10m
     memory: 32Mi
  revisionHistoryLimit: 1
  selfMonitor:
    enabled: true