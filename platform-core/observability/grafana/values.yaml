---
replicas: 1

initChownData:
  enabled: false

persistence:
  enabled: true
  type: pvc
  storageClassName: standard
  accessModes:
    - ReadWriteOnce
  size: 2Gi

serviceMonitor:
  enabled: true

route:
  main:
    enabled: true
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    hostnames:
      - dashboard.kind-cluster.local
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: ingress
        namespace: kgateway-system
        sectionName: https
    matches:
      - path:
          type: PathPrefix
          value: /

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: true

# Keep providers and dashboards explicit and empty, so future imports can be
# added by key without restructuring this values file.
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboards: {}
dashboardsConfigMaps: {}
