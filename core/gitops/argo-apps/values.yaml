---
#
# NOTE: `repoURL` für die Git-Generatoren (und die source.repoURL in der Application-Template)
# muss auf die URL zeigen, unter der dieses Repo von Argo CD erreichbar ist.
#
projects:
  platform-core:
    description: Platform core services (needed for a usable platform baseline)
    sourceRepos:
      - '*'
    destinations:
      - server: https://kubernetes.default.svc
        namespace: '*'
    clusterResourceWhitelist:
      - group: '*'
        kind: '*'
    clusterResourceBlacklist: []
  platform-features:
    description: Platform feature services (optional/enhancing capabilities)
    sourceRepos:
      - '*'
    destinations:
      - server: https://kubernetes.default.svc
        namespace: '*'
    clusterResourceWhitelist:
      - group: '*'
        kind: '*'
    clusterResourceBlacklist: []

applicationsets:
  platform-core:
    namespace: argocd
    goTemplate: true
    generators:
      - git:
          repoURL: https://github.com/dmueller01/kube-platform.git
          revision: dev
          files:
            - path: platform-core/**/app-config.yaml
            - path: platform-core/**/tmp/**/app-config.yaml
              exclude: true

    template:
      metadata:
        name: 'platform-core-{{ if .name }}{{ .name }}{{ else }}{{ .path.basenameNormalized }}{{ end }}'
        labels:
          project: platform-core
      spec:
        project: platform-core

        # Base: local chart path (overridden in templatePatch for valuesOnly/gitPath).
        source:
          repoURL: https://github.com/dmueller01/kube-platform.git
          targetRevision: dev
          path: '{{ trimPrefix "/" .path.path }}'

        destination:
          server: https://kubernetes.default.svc
          namespace: '{{ .path.basenameNormalized }}'

        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true

    # Descriptor-first mapping:
    # - wrapper: local chart from this directory (base template)
    # - valuesOnly: external chart + local values via `$values`
    # - gitPath: plain git path source
    templatePatch: &descriptorTemplatePatch |
      {{- with .argocd }}
      {{- with .applicationAnnotations }}
      metadata:
        annotations:
          {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- end }}
      spec:
        {{- if .destinationNamespace }}
        destination:
          namespace: '{{ .destinationNamespace }}'
        {{- end }}
        {{- if eq .type "gitPath" }}
        source:
          repoURL: '{{ .source.repoURL }}'
          targetRevision: '{{ .source.targetRevision }}'
          path: '{{ .source.path }}'
        {{- else if eq .type "valuesOnly" }}
        sources:
          - repoURL: '{{ .chart.repoURL }}'
            chart: '{{ .chart.name }}'
            targetRevision: '{{ .chart.version }}'
            helm:
              valueFiles:
                - $values/{{ trimPrefix "/" .path.path }}/{{ .valuesFile }}
          - repoURL: https://github.com/dmueller01/kube-platform.git
            targetRevision: dev
            path: '{{ trimPrefix "/" .path.path }}'
            ref: values
        {{- else if and .source .source.repoURL .source.path .source.targetRevision }}
        source:
          repoURL: '{{ .source.repoURL }}'
          targetRevision: '{{ .source.targetRevision }}'
          path: '{{ .source.path }}'
        {{- end }}
        syncPolicy:
          automated:
            prune: {{ if and .argocd .argocd.automated }}{{ .argocd.automated.prune | default true }}{{ else }}true{{ end }}
            selfHeal: {{ if and .argocd .argocd.automated }}{{ .argocd.automated.selfHeal | default true }}{{ else }}true{{ end }}
          syncOptions:
            {{- if and .argocd .argocd.syncOptionsOverride }}
            {{- range .argocd.syncOptionsOverride }}
            - {{ . }}
            {{- end }}
            {{- else }}
            - CreateNamespace=true
            - ServerSideApply=true
            {{- with .argocd }}
            {{- with .syncOptions }}
            {{- range . }}
            - {{ . }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
        {{- with .argocd }}
        {{- with .ignoreDifferences }}
        ignoreDifferences:
          {{ toYaml . | nindent 10 }}
        {{- end }}
        {{- end }}

  platform-features:
    namespace: argocd
    goTemplate: true
    generators:
      - git:
          repoURL: https://github.com/dmueller01/kube-platform.git
          revision: dev
          files:
            - path: platform-features/**/app-config.yaml
            - path: platform-features/**/tmp/**/app-config.yaml
              exclude: true

    template:
      metadata:
        name: 'platform-features-{{ if .name }}{{ .name }}{{ else }}{{ .path.basenameNormalized }}{{ end }}'
        labels:
          project: platform-features
      spec:
        project: platform-features

        # Base: local chart path (overridden in templatePatch for valuesOnly/gitPath).
        source:
          repoURL: https://github.com/dmueller01/kube-platform.git
          targetRevision: dev
          path: '{{ trimPrefix "/" .path.path }}'

        destination:
          server: https://kubernetes.default.svc
          namespace: '{{ .path.basenameNormalized }}'

        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true

    templatePatch: *descriptorTemplatePatch
